<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Email verification | Stumbl</title>
  <link rel="icon" href="/assets/icon.png" />
  <link rel="stylesheet" href="/email-verified/verification.css" />
</head>
<body>
  <main class="verification-shell">
    <a class="brand" href="/" aria-label="Stumbl home">
      <img src="/assets/icon.png" alt="Stumbl" />
    </a>

    <section class="result-card" aria-labelledby="result-title">
      <div class="status-icon pending" id="statusIcon" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <p class="eyebrow" id="statusEyebrow">Just a moment</p>
      <h1 id="result-title">Verifying your email…</h1>
      <p class="message" id="resultMessage" aria-live="polite">
        We’re securely confirming your email address.
      </p>
      <a class="open-button" id="openStumbl" href="stumbl://" hidden>Open Stumbl</a>
      <a class="support-link" href="/support/">Need help?</a>
    </section>
  </main>

  <script type="module" src="/email-verified/verification.js"></script>
</body>
</html>
